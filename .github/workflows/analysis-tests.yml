name: Analysis unit tests (no instruments)
on: [push, pull_request]
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Static syntax check
        run: python -m compileall -q acquisition analysis
      - name: Synthetic unit tests
        run: python -m unittest discover -s analysis/tests -v
